<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="/Rock-Paper-Scissor_Game/style.css">
</head>

<body>
    <h1>Rock Paper Scissor</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="/Rock-Paper-Scissor_Game/images/rock.png" alt="rock-img">
        </div>

        <div class="choice" id="paper">
            <img src="/Rock-Paper-Scissor_Game/images/paper.png" alt="paper-img">
        </div>

        <div class="choice" id="scissor">
            <img src="/Rock-Paper-Scissor_Game/images/scissor.png" alt="scissor-img">
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>

        <div class="score">
            <p id="computer-score">0</p>
            <p>Computer</p>
        </div>
    </div>

    <div class="msg-container">
        <div id="msg">Play your move</div>
    </div>

    <script src="/Rock-Paper-Scissor_Game/script.js"></script>
</body>

</html>
